[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-point-cloud"
version = "0.1.0"
description = "Limpa quadros de scans do Revo Scan 6, alinha scans e funde nuvens (GPU obrigatoria via CuPy)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "open3d==0.20.0",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "plotly==7.1.0",
    "meshlib==3.1.4.297",
    "scikit-learn==1.9.1",
    "pywinauto==0.6.9",
    "comtypes==1.4.17",
    "pywin32==312",
    "PySide6_Essentials==6.12.0",
    # GPU e obrigatoria (ver pipeline/gpu.py); runtime CUDA vem por pip.
    "cupy-cuda12x[ctk]==14.2.0",
    "cuda-toolkit==12.9.2.0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.4", "pre-commit>=4,<5"]

# setup.py expoe a raiz (gui) e os modulos soltos de pipeline/ e pipeline/revo_frames/ por .pth.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["pipeline/legado", "pipeline/output", "aprendizado/cache", "gui/estado"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E402",   # imports apos configurar ambiente, backend grafico e constantes de entrada
    "E731",   # callbacks numericos curtos e expressoes de log existentes
    "E741",   # nomes l, O, I (matematica: l, I)
    "B007",   # variavel de laco nao usada
    "B905",   # zip com truncamento mantido para preservar contratos existentes
    "B023",   # closures existentes em loops; alteracao de captura exige teste de comportamento
    "E501",   # kernels CUDA, HTML embutido, docstrings e expressoes cientificas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
